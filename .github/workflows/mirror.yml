name: Mirror GitLab contributions

on:
  schedule:
    - cron: "17 * * * *" # hourly; GitLab activity shows up within the hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "Jeston Singh"
          git config user.email "sjestonsingh@gmail.com"

      - name: Import new GitLab commits
        env:
          GITLAB_USER_ID: "42048126"
          # Only needed for merge requests in private projects.
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python mirror.py

      - name: Push
        run: git push origin HEAD:main
